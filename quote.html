<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Get a Quote | Audio Affairs</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #0b0b0b;
    color: white;
    line-height: 1.6;
}

a {
    color: inherit;
    text-decoration: none;
}


/* NAVIGATION */

nav {
    padding: 25px 7%;
    border-bottom: 1px solid #222;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #0b0b0b;
}

.logo {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 1px;
}

.back {
    color: #aaa;
    font-size: 14px;
}

.back:hover {
    color: white;
}


/* PAGE */

.page {
    max-width: 900px;
    margin: auto;
    padding: 100px 7%;
}

h1 {
    font-size: clamp(48px, 7vw, 80px);
    line-height: 1.05;
    margin-bottom: 20px;
}

.intro {
    color: #999;
    max-width: 650px;
    margin-bottom: 55px;
}


/* FORM */

.quote-form {
    background: #111;
    border: 1px solid #222;
    padding: 40px;
}

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px;
}

.form-group {
    margin-bottom: 25px;
}

label {
    display: block;
    color: #bbb;
    font-size: 14px;
    margin-bottom: 8px;
}

input,
select,
textarea {
    width: 100%;
    padding: 14px 15px;
    background: #0b0b0b;
    color: white;
    border: 1px solid #333;
    outline: none;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 14px;
}

input:focus,
select:focus,
textarea:focus {
    border-color: #777;
}

textarea {
    min-height: 150px;
    resize: vertical;
}

select {
    cursor: pointer;
}

.button {
    display: inline-block;
    padding: 14px 30px;
    background: white;
    color: black;
    border: 1px solid white;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: .3s;
}

.button:hover {
    background: transparent;
    color: white;
}


/* MOBILE */

@media (max-width: 700px) {

    .page {
        padding: 70px 6%;
    }

    .quote-form {
        padding: 25px;
    }

    .form-row {
        grid-template-columns: 1fr;
        gap: 0;
    }

}

</style>

</head>


<body>


<!-- NAVIGATION -->

<nav>

    <div class="logo">
        AUDIO AFFAIRS
    </div>

    <a href="index.html" class="back">
        ← Back to Home
    </a>

</nav>


<!-- QUOTE PAGE -->

<div class="page">

    <h1>
        Get a Quote.
    </h1>

    <p class="intro">
        Tell us about your event and our team will get
        back to you with the right audio, lighting and
        LED solution.
    </p>


    <form
        class="quote-form"
        action="mailto:audioaffairs.hyd@gmail.com"
        method="post"
        enctype="text/plain"
    >


        <!-- NAME + PHONE -->

        <div class="form-row">

            <div class="form-group">

                <label for="name">
                    Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="Name"
                    placeholder="Your name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="phone">
                    Phone
                </label>

                <input
                    type="tel"
                    id="phone"
                    name="Phone"
                    placeholder="Your phone number"
                    required
                >

            </div>

        </div>


        <!-- EMAIL + EVENT TYPE -->

        <div class="form-row">

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="Email"
                    placeholder="Your email address"
                    required
                >

            </div>


            <div class="form-group">

                <label for="event">
                    Event Type
                </label>

                <select
                    id="event"
                    name="Event Type"
                    required
                >

                    <option value="">
                        Select event type
                    </option>

                    <option value="Corporate Event">
                        Corporate Event
                    </option>

                    <option value="Concert">
                        Concert
                    </option>

                    <option value="Live Band">
                        Live Band
                    </option>

                    <option value="Movie Promotion">
                        Movie Promotion
                    </option>

                    <option value="Product Launch">
                        Product Launch
                    </option>

                    <option value="Club Event">
                        Club Event
                    </option>

                    <option value="Wedding / Social Event">
                        Wedding / Social Event
                    </option>

                    <option value="Sports Event">
                        Sports Event
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>

        </div>


        <!-- VENUE + DATE -->

        <div class="form-row">

            <div class="form-group">

                <label for="venue">
                    Venue
                </label>

                <input
                    type="text"
                    id="venue"
                    name="Venue"
                    placeholder="Event venue / location"
                    required
                >

            </div>


            <div class="form-group">

                <label for="date">
                    Event Date
                </label>

                <input
                    type="date"
                    id="date"
                    name="Event Date"
                    required
                >

            </div>

        </div>


        <!-- BUDGET -->

        <div class="form-group">

            <label for="budget">
                Estimated Budget
            </label>

            <select
                id="budget"
                name="Estimated Budget"
            >

                <option value="">
                    Select budget range
                </option>

                <option value="Below ₹50,000">
                    Below ₹50,000
                </option>

                <option value="₹50,000 - ₹1,00,000">
                    ₹50,000 - ₹1,00,000
                </option>

                <option value="₹1,00,000 - ₹2,00,000">
                    ₹1,00,000 - ₹2,00,000
                </option>

                <option value="₹2,00,000 - ₹5,00,000">
                    ₹2,00,000 - ₹5,00,000
                </option>

                <option value="Above ₹5,00,000">
                    Above ₹5,00,000
                </option>

                <option value="Not decided yet">
                    Not decided yet
                </option>

            </select>

        </div>


        <!-- MESSAGE -->

        <div class="form-group">

            <label for="message">
                Tell us about your event
            </label>

            <textarea
                id="message"
                name="Requirements"
                placeholder="Tell us about the event, expected audience, audio requirements, lighting, LED screens, etc."
            ></textarea>

        </div>


        <button
            type="submit"
            class="button"
        >
            Send Quote Request
        </button>


    </form>

</div>


</body>
</html>
