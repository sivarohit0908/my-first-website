<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gallery | Audio Affairs</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #0b0b0b;
    color: white;
}

a {
    color: inherit;
    text-decoration: none;
}


/* NAVIGATION */

nav {
    padding: 25px 7%;
    border-bottom: 1px solid #222;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #0b0b0b;
}

.logo {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 1px;
}

.back {
    color: #aaa;
    font-size: 14px;
}

.back:hover {
    color: white;
}


/* PAGE */

.page {
    padding: 100px 7%;
}

h1 {
    font-size: clamp(48px, 7vw, 80px);
    margin-bottom: 20px;
}

.intro {
    color: #999;
    max-width: 650px;
    margin-bottom: 60px;
}


/* GALLERY */

.gallery-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
}

.gallery-item {
    background: #111;
    overflow: hidden;
}

.gallery-item img {
    width: 100%;
    height: auto;
    display: block;
    transition: 0.4s ease;
}

.gallery-item:hover img {
    transform: scale(1.03);
}


/* MOBILE */

@media (max-width: 800px) {

    .page {
        padding: 70px 6%;
    }

    .gallery-grid {
        grid-template-columns: 1fr;
    }

}

</style>
</head>


<body>


<nav>

    <div class="logo">
        AUDIO AFFAIRS
    </div>

    <a href="index.html" class="back">
        ← Back to Home
    </a>

</nav>


<div class="page">

    <h1>
        Gallery.
    </h1>

    <p class="intro">
        A glimpse of Audio Affairs on ground and on stage.
    </p>


    <div class="gallery-grid">

        <div class="gallery-item">
            <img src="image1.jpg.jpg" alt="Audio Affairs event">
        </div>

        <div class="gallery-item">
            <img src="image2.jpg.jpg" alt="Audio Affairs event">
        </div>

        <div class="gallery-item">
            <img src="image3.jpg.jpg" alt="Audio Affairs event">
        </div>

        <div class="gallery-item">
            <img src="image4.jpg.jpg" alt="Audio Affairs event">
        </div>

        <div class="gallery-item">
            <img src="image5.jpg.jpg" alt="Audio Affairs event">
        </div>

        <div class="gallery-item">
            <img src="image6.jpg.jpg" alt="Audio Affairs event">
        </div>

    </div>

</div>


</body>
</html>
